name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: uv run --group dev ruff check .
      - name: Type check (mypy strict)
        run: uv run --group dev mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      # The coverage gate is set here rather than in pyproject so that running
      # a subset of the suite locally does not fail on partial coverage. 100%
      # is the real figure for the DUT and testbench, so anything less is a
      # regression, not a target.
      - name: Run test suite with coverage gate and HTML report
        run: >
          uv run --group dev pytest
          --cov-fail-under=100
          --cov-report=xml
          --html=report-py${{ matrix.python-version }}.html --self-contained-html
          --junitxml=junit-py${{ matrix.python-version }}.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            report-py${{ matrix.python-version }}.html
            junit-py${{ matrix.python-version }}.xml
            coverage.xml
