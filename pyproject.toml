[project]
name = "embedded-test-automation"
version = "1.3.0"
description = "HIL-style automated test framework for an embedded motor controller (simulated DUT, transport-abstracted driver, pytest + CI)"
requires-python = ">=3.10"
dependencies = []

# Declared so this is a real installable package, not only a pytest pythonpath
# entry. Downstream work (the fault-injection harness) is required to import the
# DUT and testbench rather than copy them, which needs `pip install` to work
# against a pinned tag of this repo.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dut_sim", "src/testbench"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-html>=4.0", "pytest-cov>=5.0", "pyserial>=3.5",
       "hypothesis>=6.100", "matplotlib>=3.8", "ruff>=0.6", "mypy>=1.11", "types-pyserial>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# Coverage is reported on every run so a gap is visible immediately. The
# failure threshold is applied in CI (--cov-fail-under) rather than here, so
# that running a single test file locally does not fail on partial coverage.
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.run]
branch = true
# seeded_defects.py holds deliberately broken controllers used to prove the
# fuzzer catches real bugs. Only their defective paths are exercised, by
# design, so it is measured but excluded from the production-code gate.
omit = ["src/dut_sim/seeded_defects.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
